<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff8906">
<title>RBooSH v19.3 GIFT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@900&display=swap');
*{box-sizing:border-box;font-family:'Tajawal',sans-serif}
html,body{overscroll-behavior:none!important;touch-action:none!important;position:fixed!important;overflow:hidden!important;width:100%;height:100%;margin:0;padding:0;background:#0f0e17}
#gameWrapper{width:100%;height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding-top:6px}
#h{width:95vw;max-width:420px;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px;font-weight:900;background:#1a1a2e;border-radius:14px;margin-bottom:6px;gap:6px;color:#fff}
canvas{background:linear-gradient(#1a1a2e,#0f3460);border-radius:22px;border:4px solid #ff8906;width:95vw;height:75vh;max-width:420px;max-height:760px;aspect-ratio:9/16;display:block;touch-action:none}
button{background:#ff8906;color:#000;border:none;padding:10px 16px;border-radius:50px;font-weight:900;font-size:13px;cursor:pointer;margin:3px}
#ov,#shop,#adOv,#diffOv,#adminOv{position:absolute;inset:0;background:rgba(0,0,0,0.96);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;border-radius:22px;text-align:center;padding:14px;overflow-y:auto;color:#fff}
#shop,#adOv,#diffOv,#adminOv{display:none}
.skin{display:flex;justify-content:space-between;align-items:center;background:#1a1a2e;border:2px solid #333;border-radius:14px;padding:9px 10px;margin:5px 0;width:100%;max-width:400px}
.skin.owned{border-color:#ff8906}.skin.selected{border-color:#00ff88;background:#12281e}
.codeBox{background:#0f172a;color:#22c55e;border:1px dashed #22c55e;border-radius:10px;padding:8px;font-family:monospace;direction:ltr;text-align:center;font-weight:800;margin:4px 0;font-size:12px}
</style>
</head>
<body>
<div id="gameWrapper">
<div id="h">
<div>🫓 <span id="score">0</span></div>
<div>💰 <span id="coins">0</span></div>
<div style="display:flex;gap:4px">
<button onclick="openShop()" style="padding:6px 10px">🛒</button>
</div>
</div>
<div style="position:relative">
<canvas id="c" width="400" height="720"></canvas>
<div id="ov">
<div style="font-size:56px">🏃‍♂️🫓</div>
<h1 style="font-size:40px;color:#ff8906">RBooSH</h1>
<p style="font-size:13px;margin:6px 0">أعلى سكور: <b id="best">0</b> | معك <b id="ovCoins">0</b> 🪙</p>
<button onclick="pickDiff('easy')" style="background:#00ff88;width:90%;max-width:320px">🟢 مبتدأ</button>
<button onclick="pickDiff('mid')" style="background:#ffbe0b;width:90%;max-width:320px">🟡 وسط</button>
<button onclick="pickDiff('hard')" style="background:#ff4500;color:#fff;width:90%;max-width:320px">🔴 صعب</button>
<p style="font-size:10px;color:#555;margin-top:10px">RBooSH v19.3 GIFT EDITION</p>
</div>
<div id="diffOv"><h2 id="diffTitle" style="color:#ff8906">جاهز؟</h2><button onclick="start()" style="margin-top:14px;padding:14px 30px;font-size:18px">ابدأ ▶️</button><button onclick="closeDiff()" style="background:#333;color:#fff">رجوع</button></div>

<div id="shop">
<h2 style="color:#ff8906">🛒 المتجر</h2>
<p>رصيدك: <b id="shopCoins" style="color:#ffbe0b">0</b> 🪙</p>
<button onclick="watchAd()" style="background:#00ff88;width:100%;max-width:400px">📺 إعلان +10 🪙</button>
<div id="skinsList" style="width:100%;display:flex;flex-direction:column;align-items:center;margin-top:6px"></div>

<div style="background:#1e1e2e;border:2px solid #ff8906;border-radius:14px;padding:12px;margin-top:12px;width:100%;max-width:400px;text-align:right">
<p style="font-size:12px;color:#ffbe0b;font-weight:900">🎁 كود هدية - لمرة واحدة فقط!</p>
<div style="display:flex;gap:6px;margin-top:6px"><input id="codeInp" placeholder="ادخل الكود" style="flex:1;padding:10px;border-radius:20px;border:none;text-align:center;direction:ltr;font-weight:800;text-transform:uppercase"><button onclick="redeem()" style="background:#00ff88">فك 🎁</button></div>
<div id="redeemMsg" style="font-size:11px;margin-top:6px"></div>
</div>

<button onclick="closeShop()" style="margin-top:10px;background:#333;color:#fff">رجوع</button>
<p style="font-size:9px;color:#444;margin-top:8px">اكتب ADMIN123 لفتح لوحة المولد</p>
</div>

<!-- لوحة الأدمن السرية -->
<div id="adminOv">
<h2 style="color:#00ff88">🔧 مولد أكواد الهدايا - أدمن</h2>
<p style="font-size:11px;color:#888">توليد أكواد لمرة واحدة فقط - كل كود لشخص واحد</p>

<div style="background:#1a1a2e;border:1px solid #333;border-radius:14px;padding:12px;width:100%;max-width:400px;margin:10px 0">
<label style="font-size:11px">قيمة الكود:</label>
<select id="giftValue" style="width:100%;padding:10px;border-radius:10px;background:#222;color:#fff;margin:6px 0">
<option value="50">50 عملة 🪙 - عادي</option>
<option value="100">100 عملة 🪙 - متوسط</option>
<option value="500">500 عملة 🪙 - أسطوري</option>
<option value="1000">1000 عملة 🪙 - VIP</option>
</select>
<label style="font-size:11px">عدد الأكواد:</label>
<input id="giftCount" type="number" value="10" min="1" max="50" style="width:100%;padding:10px;border-radius:10px;background:#222;color:#fff;border:1px solid #333">
<button onclick="generateCodes()" style="background:#00ff88;width:100%;margin-top:8px">🎁 توليد + حفظ</button>
</div>

<div id="generatedCodes" style="width:100%;max-width:400px"></div>
<div id="statsBox" style="background:#1a1a2e;border-radius:10px;padding:10px;width:100%;max-width:400px;margin-top:10px;font-size:11px"></div>

<button onclick="closeAdmin()" style="background:#333;color:#fff;margin-top:12px">إغلاق اللوحة</button>
<button onclick="if(confirm('حذف كل الأكواد؟')){localStorage.removeItem('rGiftPool');localStorage.removeItem('rUsedCodes');updateAdminStats();document.getElementById('generatedCodes').innerHTML='';alert('تم الحذف')}" style="background:#ff4444;color:#fff">🗑️ حذف الكل</button>
</div>

<div id="adOv"><h2 style="color:#00ff88">📺 إعلان</h2><p>انتظر <b id="adTimer">5</b> ث...</p><button id="adClaim" onclick="claimAd()" style="display:none;background:#00ff88;margin-top:12px">خذ 10 🪙</button><button onclick="closeAd()" style="background:#333;color:#fff">تخطي</button></div>
</div>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let p,it,ob,pws,sc,coins=parseInt(localStorage.getItem('rCoins')||0),best=localStorage.getItem('rB')||0,run=false,sp=3.5,fr=0,adCooldown=false,diff='mid';
let curSkin=localStorage.getItem('rSkin')||'🧒'; let owned=JSON.parse(localStorage.getItem('rOwned')||'["🧒"]');
const DIFFS={easy:{sp:2.6,hole:115,bread:70,name:'مبتدأ'},mid:{sp:3.8,hole:86,bread:58,name:'وسط'},hard:{sp:5.2,hole:62,bread:48,name:'صعب'}};
const SKIN_POWER={'🧒':{mult:1,jump:-18,jumps:2},'👨‍🍳':{mult:1.2,jump:-18,jumps:2},'🧑‍🌾':{mult:1.3,jump:-18.5,jumps:2},'👳':{mult:1.5,jump:-18.5,jumps:2},'🤠':{mult:1.6,jump:-19,jumps:2},'🥷':{mult:1.8,jump:-20,jumps:2},'👨‍🎤':{mult:2,jump:-19.5,jumps:2},'🧙‍♂️':{mult:2.2,jump:-20,jumps:3},'❄️':{mult:2.5,jump:-19,jumps:2},'👑':{mult:3,jump:-20.5,jumps:3},'🔥':{mult:3.5,jump:-21,jumps:3},'⚡':{mult:4,jump:-21,jumps:3},'💎':{mult:5,jump:-22,jumps:4},'👽':{mult:4.5,jump:-23,jumps:4},'🤖':{mult:5.5,jump:-21,jumps:5},'🐯':{mult:6,jump:-22,jumps:4}};
const SKINS=[{id:'🧒',name:'العادي',price:0},{id:'👨‍🍳',name:'الخباز',price:30},{id:'🧑‍🌾',name:'المزارع',price:60},{id:'👳',name:'العقال',price:100},{id:'🤠',name:'الكاوبوي',price:150},{id:'🥷',name:'النينجا',price:200},{id:'👨‍🎤',name:'الروك',price:200},{id:'🧙‍♂️',name:'الساحر',price:250},{id:'❄️',name:'الثلجي',price:300},{id:'👑',name:'الملك',price:400},{id:'🔥',name:'الناري',price:450},{id:'⚡',name:'البرق',price:500},{id:'💎',name:'الماسي',price:600},{id:'👽',name:'الفضائي',price:700},{id:'🤖',name:'الروبوت',price:800},{id:'🐯',name:'النمر',price:1000},];

const PERMANENT_CODES={'RBOO':20,'TIKTOK':30,'RBOOSH':50,'HASAKA':50,'RBOO50':50,'RBOO100':100,'RBOO500':500,'GIFT50':50,'GIFT100':100,'GIFT500':500};

class Pl{constructor(){const pow=SKIN_POWER[curSkin]; this.x=60;this.y=570;this.w=38;this.h=50;this.vy=0;this.jumps=0; this.maxJumps=pow.jumps; this.jumpPow=pow.jump;} upd(){this.vy+=0.95; this.y+=this.vy; if(this.y>=570){this.y=570;this.vy=0;this.jumps=0}} draw(){ctx.font='40px serif';ctx.fillText(curSkin,this.x-4,this.y+38);} jump(){if(this.jumps<this.maxJumps){this.vy=this.jumpPow; this.jumps++;}} }
function pickDiff(d){diff=d; document.getElementById('diffOv').style.display='flex'; document.getElementById('ov').style.display='none';}
function closeDiff(){document.getElementById('diffOv').style.display='none'; document.getElementById('ov').style.display='flex';}
function start(){const cfg=DIFFS[diff]; p=new Pl(); it=[]; ob=[]; pws=[]; sc=0; sp=cfg.sp; fr=0; run=true; document.getElementById('diffOv').style.display='none'; document.getElementById('ov').style.display='none'; document.getElementById('score').textContent=0; loop();}
function jump(){if(run) p.jump();}
canvas.addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false});canvas.addEventListener('mousedown',jump);
function loop(){if(!run) return; fr++; ctx.clearRect(0,0,400,720); const cfg=DIFFS[diff]; if(fr%cfg.bread==0){let yy=Math.random()*400+80; it.push({x:400,y:yy,w:30,h:30,done:false})} if(fr%cfg.hole==0) ob.push({x:400,y:590,w:34,h:30}); for(let i of it){if(!i.done){i.x-=sp; ctx.font='30px serif'; ctx.fillText('🫓',i.x,i.y); if(!i.done&&i.x<p.x+p.w&&i.x+i.w>p.x&&i.y<p.y+p.h+10&&i.y+i.h>p.y){i.done=true; let add=Math.floor(1*SKIN_POWER[curSkin].mult); sc+=1; coins+=add; localStorage.setItem('rCoins',coins); document.getElementById('score').textContent=sc; document.getElementById('coins').textContent=coins; if(sc%10==0) sp+=0.3;}} it=it.filter(x=>!x.done&&x.x>-50); for(let o of ob){o.x-=sp; ctx.font='34px serif'; ctx.fillText('🕳️',o.x,o.y+25); if(o.x<p.x+p.w-10&&o.x+o.w>p.x+10&&o.y<p.y+p.h&&o.y+o.h>p.y){return over();}} ob=ob.filter(x=>x.x>-50); p.upd(); p.draw(); ctx.fillStyle='#ff8906'; ctx.fillRect(0,620,400,8); requestAnimationFrame(loop);}
function over(){run=false; if(sc>best){best=sc; localStorage.setItem('rB',best);} const ov=document.getElementById('ov'); ov.style.display='flex'; ov.innerHTML=`<h1 style="color:#ffbe0b">جبت ${sc} خبزة!</h1><p>معك ${coins} 🪙</p><button onclick="document.getElementById('ov').style.display='none';pickDiff('${diff}')" style="width:100%">مرة تانية</button><button onclick="openShop()" style="background:#00ff88;width:100%">متجر</button>`; document.getElementById('best').textContent=best; document.getElementById('ovCoins').textContent=coins;}
function openShop(){document.getElementById('shop').style.display='flex'; renderSkins();}
function closeShop(){document.getElementById('shop').style.display='none'; if(!run) document.getElementById('ov').style.display='flex';}
function renderSkins(){document.getElementById('shopCoins').textContent=coins; document.getElementById('coins').textContent=coins; const l=document.getElementById('skinsList'); l.innerHTML=''; SKINS.forEach(s=>{const o=owned.includes(s.id),c=curSkin==s.id; const d=document.createElement('div'); d.className='skin '+(o?'owned ':'')+(c?'selected':''); let btn=c?'✅':o?`<button onclick="selectSkin('${s.id}')">استخدم</button>`:`<button onclick="buySkin('${s.id}',${s.price})">${s.price} 🪙</button>`; d.innerHTML=`<div style="display:flex;align-items:center;gap:10px"><span style="font-size:26px">${s.id}</span><div style="text-align:right"><div style="font-size:12px">${s.name}</div></div></div><div>${btn}</div>`; l.appendChild(d)})}
function buySkin(id,pr){if(coins>=pr){coins-=pr; owned.push(id); localStorage.setItem('rCoins',coins); localStorage.setItem('rOwned',JSON.stringify(owned)); document.getElementById('coins').textContent=coins; selectSkin(id);} else alert('ما عندك عملات!');}
function selectSkin(id){curSkin=id; localStorage.setItem('rSkin',id); renderSkins();}

// ===== نظام الأكواد الجديد =====
function getGiftPool(){return JSON.parse(localStorage.getItem('rGiftPool')||'{}')}
function saveGiftPool(p){localStorage.setItem('rGiftPool',JSON.stringify(p)); updateAdminStats();}

function redeem(){
  const inp=document.getElementById('codeInp');
  const codeRaw=inp.value.trim().toUpperCase();
  if(!codeRaw){return}

  // كود الأدمن السري
  if(codeRaw==='ADMIN123'){
    openAdmin(); inp.value=''; return;
  }

  const msg=document.getElementById('redeemMsg');

  // هل مستخدم قبل بنفس الجهاز؟
  if(localStorage.getItem('used_'+codeRaw)==='1'){
    msg.innerHTML='<span style="color:#ff4444">⚠️ استخدمت هاد الكود قبل - لمرة واحدة فقط!</span>';
    return;
  }

  // أكواد دائمة (للجميع)
  if(PERMANENT_CODES[codeRaw]){
    let amount=PERMANENT_CODES[codeRaw];
    coins+=amount; localStorage.setItem('rCoins',coins);
    localStorage.setItem('used_'+codeRaw,'1');
    document.getElementById('coins').textContent=coins;
    document.getElementById('shopCoins').textContent=coins;
    renderSkins();
    msg.innerHTML='<span style="color:#00ff88">🎉 مبروك +'+amount+' 🪙 - كود دائم</span>';
    inp.value=''; return;
  }

  // أكواد مولدة (هدايا خاصة - لمرة واحدة)
  let pool=getGiftPool();
  if(pool[codeRaw]){
    if(pool[codeRaw].used){
      msg.innerHTML='<span style="color:#ff4444">❌ الكود مستخدم من قبل - '+pool[codeRaw].usedBy+'</span>';
      return;
    }
    let amount=pool[codeRaw].value;
    coins+=amount; localStorage.setItem('rCoins',coins);
    pool[codeRaw].used=true;
    pool[codeRaw].usedBy=new Date().toLocaleString();
    saveGiftPool(pool);
    localStorage.setItem('used_'+codeRaw,'1');
    document.getElementById('coins').textContent=coins;
    document.getElementById('shopCoins').textContent=coins;
    renderSkins();
    msg.innerHTML='<span style="color:#00ff88">🎁 هدية خاصة +'+amount+' 🪙 - انحرق ✅</span>';
    inp.value=''; return;
  }

  msg.innerHTML='<span style="color:#ff4444">❌ كود غلط - تابع التيك توك</span>';
}

// ===== لوحة الأدمن =====
function openAdmin(){document.getElementById('adminOv').style.display='flex'; updateAdminStats();}
function closeAdmin(){document.getElementById('adminOv').style.display='none';}
function updateAdminStats(){
  let pool=getGiftPool(); let keys=Object.keys(pool);
  let used=keys.filter(k=>pool[k].used).length;
  document.getElementById('statsBox').innerHTML=`إجمالي الأكواد: ${keys.length} | مستخدم: ${used} | متبقي: ${keys.length-used}<br>كل كود يعمل مرة واحدة فقط`;
}
function generateCodes(){
  let val=parseInt(document.getElementById('giftValue').value);
  let count=parseInt(document.getElementById('giftCount').value)||10;
  let pool=getGiftPool(); let out=[];
  for(let i=0;i<count;i++){
    let rnd=Math.random().toString(36).substring(2,6).toUpperCase()+Math.floor(Math.random()*99);
    let code=`RBOOSH${val}-${rnd}`;
    pool[code]={value:val,used:false,usedBy:null};
    out.push(code);
  }
  saveGiftPool(pool);
  document.getElementById('generatedCodes').innerHTML=out.map(c=>`<div class="codeBox">${c} = ${val} 🪙</div>`).join('')+
  `<button onclick="navigator.clipboard.writeText('${out.join('\\n')}');alert('تم نسخ ${out.length} كود')" style="background:#00ff88;width:100%;margin-top:8px">📋 نسخ الكل وارسال للاعبين</button>`;
}

function watchAd(){document.getElementById('adOv').style.display='flex'; let t=5;document.getElementById('adTimer').textContent=t;document.getElementById('adClaim').style.display='none'; const iv=setInterval(()=>{t--;document.getElementById('adTimer').textContent=t;if(t<=0){clearInterval(iv);document.getElementById('adTimer').textContent='خلص!';document.getElementById('adClaim').style.display='block';}},1000);}
function claimAd(){coins+=10; localStorage.setItem('rCoins',coins); document.getElementById('coins').textContent=coins; document.getElementById('shopCoins').textContent=coins; document.getElementById('adOv').style.display='none'; renderSkins();}
function closeAd(){document.getElementById('adOv').style.display='none';}

document.getElementById('coins').textContent=coins;
document.getElementById('best').textContent=best;
document.getElementById('ovCoins').textContent=coins;
renderSkins();
</script>
</body>
</html>

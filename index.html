<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>RBooSH v20 PLAYERS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@900&display=swap');
*{box-sizing:border-box;font-family:'Tajawal',sans-serif}
html,body{margin:0;padding:0;background:#0f0e17;width:100%;height:100%;overflow:hidden;position:fixed}
#gameWrapper{width:100%;height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding-top:6px}
#h{width:95vw;max-width:420px;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px;font-weight:900;background:#1a1a2e;border-radius:14px;margin-bottom:6px;color:#fff}
#topPlayerBanner{width:95vw;max-width:420px;background:linear-gradient(90deg,#ff8906,#ffbe0b);color:#000;padding:8px 10px;border-radius:10px;font-size:12px;font-weight:900;text-align:center;margin-bottom:6px;display:none}
canvas{background:linear-gradient(#1a1a2e,#0f3460);border-radius:22px;border:4px solid #ff8906;width:95vw;height:75vh;max-width:420px;max-height:760px;aspect-ratio:9/16;display:block;touch-action:none}
button{background:#ff8906;color:#000;border:none;padding:10px 16px;border-radius:50px;font-weight:900;font-size:13px;cursor:pointer;margin:3px}
#ov,#shop,#adOv,#diffOv,#nameOv{position:absolute;inset:0;background:rgba(0,0,0,0.96);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;border-radius:22px;text-align:center;padding:14px;overflow-y:auto;color:#fff}
#shop,#adOv,#diffOv,#nameOv{display:none}
.leaderboard{width:100%;max-width:320px;background:#1a1a2e;border:2px solid #ffbe0b;border-radius:14px;padding:10px;margin:10px 0}
.leaderRow{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid #222;font-size:12px}
.leaderRow.top1{background:linear-gradient(90deg,#ffbe0b,#ff8906);color:#000;border-radius:8px}
.playerRow{display:flex;justify-content:space-between;align-items:center;background:#1e1e2e;border:1px solid #333;border-radius:10px;padding:8px;margin:5px 0;font-size:12px;width:100%}
#adminBox input,#adminBox select{width:100%;padding:9px;border-radius:8px;background:#222;color:#fff;border:1px solid #444;margin:4px 0}
.skin{display:flex;justify-content:space-between;align-items:center;background:#1a1a2e;border:2px solid #333;border-radius:14px;padding:9px 10px;margin:5px 0;width:100%;max-width:400px}
.skin.owned{border-color:#ff8906}.skin.selected{border-color:#00ff88;background:#12281e}
.diffBtn{width:100%;max-width:320px;padding:14px;margin:6px 0;font-size:16px;border-radius:14px}
</style>
</head>
<body>
<div id="gameWrapper">
<div id="topPlayerBanner"></div>
<div id="h"><div>🫓 <span id="score">0</span></div><div>💰 <span id="coins">0</span></div><button onclick="openShop()">🛒</button></div>
<div style="position:relative">
<canvas id="c" width="400" height="720"></canvas>

<div id="ov">
<div style="font-size:56px">🏃‍♂️🫓</div>
<h1 style="font-size:40px;color:#ff8906">RBooSH</h1>
<p>أعلى: <b id="best">0</b> | معك <b id="ovCoins">0</b> 🪙</p>
<div class="leaderboard"><p style="color:#ffbe0b">🏆 أفضل 10 لاعبين</p><div id="top10List"></div></div>
<button class="diffBtn" onclick="pickDiff('easy')" style="background:#00ff88">🟢 مبتدأ</button>
<button class="diffBtn" onclick="pickDiff('mid')" style="background:#ffbe0b">🟡 وسط</button>
<button class="diffBtn" onclick="pickDiff('hard')" style="background:#ff4500;color:#fff">🔴 صعب</button>
</div>

<div id="diffOv"><h2 id="diffTitle">جاهز؟</h2><button onclick="start()">ابدأ ▶️</button><button onclick="closeDiff()" style="background:#333;color:#fff">رجوع</button></div>

<div id="nameOv">
<h2 style="color:#ffbe0b">🎉 سكور عالي!</h2><p>جبت <b id="finalScore">0</b></p>
<input id="playerNameInput" placeholder="اسمك" style="width:100%;max-width:300px;padding:12px;border-radius:20px;border:2px solid #ffbe0b;text-align:center;background:#222;color:#fff;margin:10px 0">
<div style="display:flex;gap:6px"><button onclick="savePlayerName()" style="background:#00ff88">💾 حفظ</button><button onclick="skipName()" style="background:#333;color:#fff">تخطي</button></div>
</div>

<div id="shop">
<h2>🛒 المتجر</h2><p>رصيدك: <b id="shopCoins">0</b></p>
<div id="skinsList"></div>
<div style="background:#1e1e2e;border:2px solid #ff8906;border-radius:14px;padding:10px;width:100%;max-width:400px">
<input id="codeInp" placeholder="كود" style="flex:1;padding:10px;border-radius:20px;text-align:center;direction:ltr"><button onclick="redeem()" style="background:#00ff88">فك</button>
<div id="redeemMsg"></div>
</div>
<button onclick="closeShop()" style="background:#333;color:#fff">رجوع</button>

<div id="adminBox" style="display:none;background:#111;border:1px dashed #0f0;border-radius:12px;padding:12px;margin-top:12px;width:100%;max-width:400px">
<p style="color:#0f0;text-align:center">🔧 ADMIN</p>
<div style="display:flex;gap:4px">
<button onclick="showAdminTab('codes')" id="tabCodes" style="flex:1;background:#0f0;color:#000">🎁 أكواد</button>
<button onclick="showAdminTab('players')" id="tabPlayers" style="flex:1;background:#333;color:#fff">👥 لاعبين</button>
</div>
<div id="adminCodesTab"><select id="giftValue"><option value="50">50</option><option value="100">100</option><option value="500">500</option></select><input id="giftCount" type="number" value="10"><button onclick="generateCodes()" style="background:#0f0;width:100%">توليد</button><div id="generatedCodes"></div></div>
<div id="adminPlayersTab" style="display:none"><input id="newPlayerName" placeholder="اسم"><input id="newPlayerScore" type="number" placeholder="سكور"><button onclick="addPlayer()" style="background:#00d4ff;width:100%">➕ إضافة</button><div id="playersList" style="margin-top:8px"></div><input id="customAd" placeholder="إعلان"><div style="display:flex;gap:4px"><button onclick="setCustomAd()" style="flex:1;background:#ff8906">نشر</button><button onclick="clearCustomAd()" style="flex:1;background:#333;color:#fff">حذف</button></div><button onclick="setWeeklyBest()" style="background:#ffbe0b;width:100%">🏆 أفضل لاعب</button></div>
</div>
</div>

<div id="adOv"><h2>📺 إعلان</h2><p><b id="adTimer">5</b></p><button id="adClaim" onclick="claimAd()" style="display:none;background:#00ff88">خذ 10</button><button onclick="closeAd()" style="background:#333;color:#fff">تخطي</button></div>

</div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let p,it,ob,sc,coins=parseInt(localStorage.getItem('rCoins')||0),best=localStorage.getItem('rB')||0,run=false,sp=3.5,fr=0,diff='mid',tempScore=0;
let curSkin=localStorage.getItem('rSkin')||'🧒'; let owned=JSON.parse(localStorage.getItem('rOwned')||'["🧒"]');
const DIFFS={easy:{sp:2.6,hole:115,bread:70},mid:{sp:3.8,hole:86,bread:58},hard:{sp:5.2,hole:62,bread:48}};
const SKINS=[{id:'🧒',name:'العادي',price:0},{id:'👨‍🍳',name:'الخباز',price:30},{id:'👳',name:'العقال',price:100},{id:'🤠',name:'الكاوبوي',price:150},{id:'🐯',name:'النمر',price:1000}];
class Pl{constructor(){this.x=60;this.y=570;this.w=38;this.h=50;this.vy=0;this.jumps=0;} upd(){this.vy+=0.95; this.y+=this.vy; if(this.y>=570){this.y=570;this.vy=0;this.jumps=0}} draw(){ctx.font='40px serif';ctx.fillText(curSkin,this.x-4,this.y+38);} jump(){if(this.jumps<2){this.vy=-18; this.jumps++;}} }
function pickDiff(d){diff=d;document.getElementById('diffOv').style.display='flex';document.getElementById('ov').style.display='none';}
function closeDiff(){document.getElementById('diffOv').style.display='none';document.getElementById('ov').style.display='flex';renderTop10();}
function start(){let cfg=DIFFS[diff];p=new Pl();it=[];ob=[];sc=0;sp=cfg.sp;fr=0;run=true;document.getElementById('diffOv').style.display='none';document.getElementById('score').textContent=0;loop();}
function jump(){if(run)p.jump();}canvas.addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false});canvas.addEventListener('mousedown',jump);
function loop(){if(!run)return;fr++;ctx.clearRect(0,0,400,720);let cfg=DIFFS[diff];if(fr%cfg.bread==0)it.push({x:400,y:Math.random()*400+80,w:30,h:30,done:false});if(fr%cfg.hole==0)ob.push({x:400,y:590,w:34,h:30});for(let i of it){if(!i.done){i.x-=sp;ctx.font='30px serif';ctx.fillText('🫓',i.x,i.y);if(i.x<p.x+p.w&&i.x+i.w>p.x&&i.y<p.y+p.h+10&&i.y+i.h>p.y){i.done=true;sc+=1;coins+=1;localStorage.setItem('rCoins',coins);document.getElementById('score').textContent=sc;}}}it=it.filter(x=>!x.done&&x.x>-50);for(let o of ob){o.x-=sp;ctx.font='34px serif';ctx.fillText('🕳️',o.x,o.y+25);if(o.x<p.x+p.w-10&&o.x+o.w>p.x+10&&o.y<p.y+p.h&&o.y+o.h>p.y){return over();}}ob=ob.filter(x=>x.x>-50);p.upd();p.draw();ctx.fillStyle='#ff8906';ctx.fillRect(0,620,400,8);requestAnimationFrame(loop);}
function over(){run=false;if(sc>best){best=sc;localStorage.setItem('rB',best);}tempScore=sc;let pl=getPlayers();pl.sort((a,b)=>b.score-a.score);let low=pl.length<10?0:(pl[9]?.score||0);if(sc>0&&(pl.length<10||sc>low)){document.getElementById('finalScore').textContent=sc;document.getElementById('nameOv').style.display='flex';}else showGameOverScreen();}
function savePlayerName(){let n=document.getElementById('playerNameInput').value.trim();if(!n)return;let pl=getPlayers();pl.push({name:n,score:tempScore,id:Date.now()});localStorage.setItem('rPlayers',JSON.stringify(pl));localStorage.setItem('rWeeklyBest',JSON.stringify({name:n,score:tempScore}));document.getElementById('nameOv').style.display='none';showGameOverScreen();updateBanner();renderTop10();}
function skipName(){document.getElementById('nameOv').style.display='none';showGameOverScreen();}
function showGameOverScreen(){let ov=document.getElementById('ov');ov.style.display='flex';ov.innerHTML=`<h1>جبت ${tempScore}!</h1><div class="leaderboard"><div id="top10ListOver"></div></div><button onclick="pickDiff('${diff}')">مرة تانية</button>`;renderTop10(true);}
function openShop(){document.getElementById('shop').style.display='flex';renderSkins();}
function closeShop(){document.getElementById('shop').style.display='none';if(!run)document.getElementById('ov').style.display='flex';renderTop10();}
function renderSkins(){document.getElementById('shopCoins').textContent=coins;let l=document.getElementById('skinsList');l.innerHTML='';SKINS.forEach(s=>{let o=owned.includes(s.id);let c=curSkin==s.id;let d=document.createElement('div');d.className='skin '+(o?'owned ':'')+(c?'selected':'');let b=c?'✅':o?`<button onclick="selectSkin('${s.id}')">استخدم</button>`:`<button onclick="buySkin('${s.id}',${s.price})">${s.price} 🪙</button>`;d.innerHTML=`<div>${s.id} ${s.name}</div><div>${b}</div>`;l.appendChild(d)})}
function buySkin(id,pr){if(coins>=pr){coins-=pr;owned.push(id);localStorage.setItem('rCoins',coins);localStorage.setItem('rOwned',JSON.stringify(owned));selectSkin(id);}else alert('ما عندك');}
function selectSkin(id){curSkin=id;localStorage.setItem('rSkin',id);renderSkins();}
function getGiftPool(){return JSON.parse(localStorage.getItem('rGiftPool')||'{}')}
function redeem(){let el=document.getElementById('codeInp');let code=el.value.trim().toUpperCase();let msg=document.getElementById('redeemMsg');if(!code)return;if(code==='ADMIN123'){document.getElementById('adminBox').style.display='block';msg.textContent='✅ فتح';el.value='';showAdminTab('players');renderPlayers();return;}if(localStorage.getItem('used_'+code)==='1'){msg.textContent='مستخدم';return;}let pool=getGiftPool();if(pool[code]&&!pool[code].used){coins+=pool[code].value;localStorage.setItem('rCoins',coins);pool[code].used=true;localStorage.setItem('rGiftPool',JSON.stringify(pool));localStorage.setItem('used_'+code,'1');msg.textContent='+'+pool[code].value;el.value='';return;}msg.textContent='❌';}
function showAdminTab(t){document.getElementById('adminCodesTab').style.display=t==='codes'?'block':'none';document.getElementById('adminPlayersTab').style.display=t==='players'?'block':'none';document.getElementById('tabCodes').style.background=t==='codes'?'#0f0':'#333';document.getElementById('tabPlayers').style.background=t==='players'?'#0f0':'#333';if(t==='players')renderPlayers();}
function generateCodes(){let val=parseInt(document.getElementById('giftValue').value);let cnt=parseInt(document.getElementById('giftCount').value)||10;let pool=getGiftPool();let out=[];for(let i=0;i<cnt;i++){let r=Math.random().toString(36).substring(2,7).toUpperCase();let c=`RBOOSH${val}-${r}`;pool[c]={value:val,used:false};out.push(c);}localStorage.setItem('rGiftPool',JSON.stringify(pool));document.getElementById('generatedCodes').innerHTML=out.map(c=>`<div style="background:#000;color:#0f0;padding:4px;margin:2px">${c}</div>`).join('');}
function getPlayers(){return JSON.parse(localStorage.getItem('rPlayers')||'[]');}
function addPlayer(){let n=document.getElementById('newPlayerName').value.trim();let s=parseInt(document.getElementById('newPlayerScore').value)||0;if(!n)return;let pl=getPlayers();pl.push({name:n,score:s,id:Date.now()});localStorage.setItem('rPlayers',JSON.stringify(pl));renderPlayers();renderTop10();updateBanner();}
function renderPlayers(){let pl=getPlayers();let list=document.getElementById('playersList');if(!pl.length){list.innerHTML='ما في';return;}pl.sort((a,b)=>b.score-a.score);list.innerHTML=pl.map((p,i)=>`<div class="playerRow"><div>${i+1}. ${p.name} - ${p.score}</div><div><button onclick="deletePlayer(${p.id})" style="background:#f44">🗑️</button></div></div>`).join('');}
function renderTop10(isOver=false){let pl=getPlayers();let el=document.getElementById(isOver?'top10ListOver':'top10List');if(!el)return;if(!pl.length){el.innerHTML='كن أول بطل!';return;}pl.sort((a,b)=>b.score-a.score);el.innerHTML=pl.slice(0,10).map((p,i)=>`<div class="leaderRow"><span>${i+1}. ${p.name}</span><span>${p.score}</span></div>`).join('');}
function deletePlayer(id){localStorage.setItem('rPlayers',JSON.stringify(getPlayers().filter(x=>x.id!==id)));renderPlayers();renderTop10();updateBanner();}
function setWeeklyBest(){let pl=getPlayers();if(!pl.length)return;pl.sort((a,b)=>b.score-a.score);localStorage.setItem('rWeeklyBest',JSON.stringify(pl[0]));alert(pl[0].name);updateBanner();}
function setCustomAd(){let ad=document.getElementById('customAd').value.trim();if(!ad)return;localStorage.setItem('rCustomAd',ad);updateBanner();}
function clearCustomAd(){localStorage.removeItem('rCustomAd');updateBanner();}
function updateBanner(){let b=document.getElementById('topPlayerBanner');let best=JSON.parse(localStorage.getItem('rWeeklyBest')||'null');let custom=localStorage.getItem('rCustomAd')||'';if(custom){b.style.display='block';b.textContent='📢 '+custom;return;}if(best){b.style.display='block';b.textContent=`🏆 ${best.name} - ${best.score}`;}else b.style.display='none';}
function closeAd(){document.getElementById('adOv').style.display='none';}
function claimAd(){coins+=10;localStorage.setItem('rCoins',coins);document.getElementById('adOv').style.display='none';}
document.getElementById('coins').textContent=coins;document.getElementById('ovCoins').textContent=coins;document.getElementById('best').textContent=best;setTimeout(()=>{updateBanner();renderTop10();},300);
</script>
</body>
</html>

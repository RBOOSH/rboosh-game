<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>RBooSH v20 BANNER CONTROL</title><style>@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@900&display=swap');*{box-sizing:border-box;font-family:'Tajawal',sans-serif}html,body{margin:0;padding:0;background:#0f0e17;width:100%;height:100%;overflow:hidden;position:fixed}#gameWrapper{width:100%;height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding-top:6px}#h{width:95vw;max-width:420px;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px;font-weight:900;background:#1a1a2e;border-radius:14px;margin-bottom:6px;color:#fff}#topPlayerBanner{width:95vw;max-width:420px;background:linear-gradient(90deg,#ff8906,#ffbe0b);color:#000;padding:7px 10px;border-radius:10px;font-size:12px;font-weight:900;text-align:center;margin-bottom:6px;display:none}canvas{background:linear-gradient(#1a1a2e,#0f3460);border-radius:22px;border:4px solid #ff8906;width:95vw;height:75vh;max-width:420px;max-height:760px;aspect-ratio:9/16;display:block;touch-action:none}button{background:#ff8906;color:#000;border:none;padding:12px 18px;border-radius:50px;font-weight:900;font-size:14px;cursor:pointer;margin:4px;touch-action:manipulation}#ov,#shop,#diffOv,#nameOv{position:absolute;inset:0;background:rgba(0,0,0,.97);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;border-radius:22px;text-align:center;padding:16px;overflow-y:auto;color:#fff}#shop,#diffOv,#nameOv{display:none}.leaderboard{width:100%;max-width:320px;background:#1a1a2e;border:2px solid #ffbe0b;border-radius:14px;padding:10px;margin-top:10px}.leaderRow{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid #222;font-size:12px}.leaderRow.top1{background:linear-gradient(90deg,#ffbe0b,#ff8906);color:#000;border-radius:8px;font-weight:900}.diffBtn{width:100%;max-width:320px;padding:16px;margin:8px 0;font-size:18px;border-radius:16px}.skin{display:flex;justify-content:space-between;align-items:center;background:#1a1a2e;border:2px solid #333;border-radius:14px;padding:10px;margin:5px 0;width:100%;max-width:400px}.skin.owned{border-color:#ff8906}.skin.selected{border-color:#00ff88;background:#12281e}</style></head><body><div id="gameWrapper"><div id="topPlayerBanner"></div><div id="h"><div>🫓 <span id="score">0</span></div><div>💰 <span id="coins">0</span></div><button onclick="openShop()">🛒</button></div><div style="position:relative"><canvas id="c" width="400" height="720"></canvas><div id="ov"><div style="font-size:56px">🫓🏃‍♂️</div><h1 style="font-size:40px;color:#ff8906;margin:8px 0">RBooSH</h1><p>أعلى سكور: <b id="best">0</b> | معك <b id="ovCoins">0</b> 🪙</p><div class="leaderboard"><p style="color:#ffbe0b;font-weight:900;margin:0 0 6px 0">🏆 أفضل 10 لاعبين</p><div id="top10List"><p style="color:#555;font-size:11px">كن أول بطل!</p></div></div><p style="color:#ffbe0b;margin-top:12px;font-weight:900">اختر الصعوبة:</p><button class="diffBtn" onclick="pickDiff('easy')" style="background:#00ff88">🟢 مبتدأ</button><button class="diffBtn" onclick="pickDiff('mid')" style="background:#ffbe0b">🟡 وسط</button><button class="diffBtn" onclick="pickDiff('hard')" style="background:#ff4500;color:#fff">🔴 صعب</button><p style="font-size:10px;color:#555;margin-top:10px">v20 BANNER CONTROL</p></div><div id="diffOv"><h2 id="diffTitle">جاهز؟</h2><p id="diffDesc" style="color:#aaa;font-size:12px"></p><button onclick="start()" style="padding:16px 32px;font-size:20px;margin-top:14px">ابدأ ▶️</button><button onclick="closeDiff()" style="background:#333;color:#fff">رجوع</button></div><div id="nameOv"><h2 style="color:#ffbe0b">🎉 سكور عالي!</h2><p>جبت <b id="finalScore" style="color:#00ff88">0</b> خبزة</p><input id="playerNameInput" placeholder="اسمك" style="width:100%;max-width:300px;padding:12px;border-radius:20px;border:2px solid #ffbe0b;text-align:center;background:#222;color:#fff;font-weight:900"><div style="display:flex;gap:6px;margin-top:8px"><button onclick="savePlayerName()" style="background:#00ff88">💾 حفظ</button><button onclick="skipName()" style="background:#333;color:#fff">تخطي</button></div></div><div id="shop"><h2 style="color:#ff8906">🛒 المتجر</h2><p>رصيدك: <b id="shopCoins">0</b> 🪙</p><div id="skinsList"></div><div style="margin-top:10px;width:100%;max-width:400px;background:#1e1e2e;border:2px solid #ff8906;border-radius:14px;padding:10px"><div style="display:flex;gap:4px"><input id="codeInp" placeholder="كود هدية" style="flex:1;padding:10px;border-radius:20px;border:none;text-align:center;direction:ltr;text-transform:uppercase"><button onclick="redeem()" style="background:#00ff88">فك</button></div><div id="redeemMsg" style="font-size:11px;margin-top:6px"></div></div><button onclick="closeShop()" style="background:#333;color:#fff;margin-top:10px">رجوع ⬅️</button><div id="adminBox" style="display:none;background:#111;border:1px dashed #0f0;border-radius:12px;padding:10px;margin-top:10px;width:100%;max-width:400px"><p style="color:#0f0;font-weight:900;margin:0">🔧 ADMIN123 - اكواد هدايا</p><div style="display:flex;gap:4px;margin-top:6px"><select id="giftValue"><option value="100">100</option><option value="1000">1000</option><option value="10000">10000</option><option value="150000">150000</option></select><button onclick="generateCodes()" style="background:#0f0;flex:1">توليد</button></div><div id="generatedCodes"></div><hr style="margin:12px 0;border-color:#333"><p style="color:#ffbe0b;font-weight:900;margin:0">📢 لوحة الاعلانات العامة - تظهر لكل الناس فوق</p><textarea id="announceText" placeholder="اكتب اعلانك: مثلا تابعوني @... او كود مجاني..." style="width:100%;height:70px;padding:8px;border-radius:10px;background:#222;color:#fff;border:1px solid #ffbe0b;margin-top:6px"></textarea><div style="display:flex;gap:4px;margin-top:6px"><button onclick="createAnnounceBin()" style="background:#00aaff;flex:1;font-size:11px">🔗 انشاء رابط</button><button onclick="publishAnnouncement()" style="background:#ffbe0b;flex:1;font-size:11px">📢 نشر للكل</button><button onclick="clearAnnouncement()" style="background:#ff4444;color:#fff;font-size:11px">🗑️</button></div><div id="announceStatus" style="font-size:10px;color:#aaa;margin-top:4px;min-height:14px"></div><div style="font-size:8px;color:#555;margin-top:4px;word-break:break-all">الرابط: <span id="currentAnnounceUrl"></span></div></div></div></div></div><script>
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var p,it=[],ob=[],sc=0,coins=parseInt(localStorage.getItem('rCoins')||'0'),best=parseInt(localStorage.getItem('rB')||'0'),run=false,sp=3.5,fr=0,diff='mid',tempScore=0,shield=0,ghostTimer=0,ghostActive=0;
var powerUps=[], nextPowerUp=1800, extraLife=0, superMagTimer=0;
var curSkin=localStorage.getItem('rSkin')||'🧒'; var owned=JSON.parse(localStorage.getItem('rOwned')||'["🧒"]');
var DIFFS={easy:{sp:2.6,hole:115,bread:70,name:'مبتدأ'},mid:{sp:3.8,hole:86,bread:58,name:'وسط'},hard:{sp:5.2,hole:62,bread:48,name:'صعب'}};
var SKINS=[{id:'🧒',name:'العادي',price:0,desc:'عادي',jumps:0,magnet:0,shield:0,x2:0},{id:'🧑‍🌾',name:'المزارع',price:100,desc:'شكل فقط',jumps:0,magnet:0,shield:0,x2:0},{id:'👳',name:'العقال',price:300,desc:'شكل فقط',jumps:0,magnet:0,shield:0,x2:0},{id:'🤠',name:'الكاوبوي',price:500,desc:'شكل فقط',jumps:0,magnet:0,shield:0,x2:0},{id:'🥷',name:'النينجا',price:1000,desc:'قفزة ثالثة',jumps:1,magnet:0,shield:0,x2:0},{id:'👨‍🎤',name:'الروك',price:2500,desc:'قفزة ثالثة',jumps:1,magnet:0,shield:0,x2:0},{id:'🧙‍♂️',name:'الساحر',price:5000,desc:'قفزتين زيادة',jumps:2,magnet:0,shield:0,x2:0},{id:'❄️',name:'الثلجي',price:10000,desc:'مغناطيس 80',jumps:0,magnet:80,shield:0,x2:0},{id:'👑',name:'الملك',price:15000,desc:'مغناطيس 130',jumps:0,magnet:130,shield:0,x2:0},{id:'🔥',name:'الناري',price:25000,desc:'مغناطيس+قفزة',jumps:1,magnet:100,shield:0,x2:0},{id:'⚡',name:'البرق',price:40000,desc:'درع',jumps:0,magnet:0,shield:1,x2:0},{id:'💎',name:'الماسي',price:50000,desc:'درع+×2',jumps:0,magnet:0,shield:1,x2:1},{id:'👽',name:'الفضائي',price:70000,desc:'مغناطيس+درع+×2',jumps:0,magnet:120,shield:1,x2:1},{id:'🤖',name:'الروبوت',price:80000,desc:'كل المميزات',jumps:1,magnet:120,shield:1,x2:1},{id:'🐯',name:'النمر',price:100000,desc:'أسطوري',jumps:2,magnet:150,shield:1,x2:1},{id:'👻',name:'الشبح',price:150000,desc:'👻 داش+طيران+اختفاء',jumps:2,magnet:150,shield:1,x2:1,dash:1,glide:1,ghost:1},{id:'🦁',name:'الأسد',price:200000,desc:'🦁 درعين+3 قفزات+مغناطيس 200+زئير',jumps:3,magnet:200,shield:2,x2:0,dash:0,glide:0,ghost:0}];
function getCurSkinObj(){for(var i=0;i<SKINS.length;i++){if(SKINS[i].id===curSkin) return SKINS[i];} return SKINS[0];}
function Pl(){this.x=60;this.y=570;this.w=38;this.h=50;this.vy=0;this.jumps=0;this.lastJump=0;this.dashing=false;}
Pl.prototype.upd=function(){var s=getCurSkinObj(); if(s.glide && this.vy>2){this.vy*=0.88;} else {this.vy+=0.95;} this.y+=this.vy; if(this.y>=570){this.y=570;this.vy=0;this.jumps=0;}};
Pl.prototype.draw=function(){ctx.save();var pulse=(Math.sin(fr*0.12)+1)/2;if(extraLife>0){var r1=45+pulse*15; ctx.beginPath(); ctx.arc(this.x+18,this.y+20,r1,0,Math.PI*2); ctx.strokeStyle='rgba(255,50,80,'+(0.4+pulse*0.4)+')'; ctx.lineWidth=4; ctx.stroke(); ctx.shadowColor='#ff3355'; ctx.shadowBlur=20; ctx.stroke();}if(shield>0){var r2=55+pulse*10; ctx.beginPath(); ctx.arc(this.x+18,this.y+20,r2,0,Math.PI*2); ctx.strokeStyle='rgba(255,215,0,'+(0.3+pulse*0.3)+')'; ctx.lineWidth=3; ctx.setLineDash([6,4]); ctx.lineDashOffset=fr*0.5; ctx.stroke(); ctx.setLineDash([]);}if(superMagTimer>0){var r3=65+pulse*20; ctx.beginPath(); ctx.arc(this.x+18,this.y+20,r3,0,Math.PI*2); ctx.strokeStyle='rgba(0,255,255,'+(0.3+pulse*0.3)+')'; ctx.lineWidth=3; ctx.stroke();}if(ghostActive>0){ctx.globalAlpha=0.25;} if(this.dashing){ctx.shadowColor='#00ffff';ctx.shadowBlur=20;} ctx.shadowBlur=0; ctx.font='40px serif'; ctx.fillText(curSkin,this.x-4,this.y+38); ctx.restore();};
Pl.prototype.jump=function(){var s=getCurSkinObj(); var now=Date.now(); var maxJ=2+s.jumps; if(this.jumps<maxJ){this.vy=-18; if(s.glide){this.vy=-12;} this.jumps++; this.lastJump=now;} else if(s.dash && now-this.lastJump<350 &&!this.dashing){this.dashing=true; this.x+=110; var self=this; setTimeout(function(){self.dashing=false;},350); this.lastJump=now;}};
function pickDiff(d){diff=d; var cfg=DIFFS[d]; document.getElementById('diffTitle').innerText='صعوبة: '+cfg.name; document.getElementById('diffDesc').innerText='سرعة: '+cfg.sp+' - الحفر كل '+cfg.hole; document.getElementById('ov').style.display='none'; document.getElementById('diffOv').style.display='flex';}
function closeDiff(){document.getElementById('diffOv').style.display='none'; document.getElementById('ov').style.display='flex';}
function start(){var cfg=DIFFS[diff]; p=new Pl(); it=[]; ob=[]; powerUps=[]; sc=0; sp=cfg.sp; fr=0; run=true; shield=getCurSkinObj().shield; ghostTimer=0; ghostActive=0; extraLife=0; superMagTimer=0; nextPowerUp=Math.floor(Math.random()*(3600-1800)+1800); document.getElementById('diffOv').style.display='none'; document.getElementById('score').innerText='0'; loop();}
function jump(){if(run && p) p.jump();}
canvas.addEventListener('touchstart',function(e){e.preventDefault(); jump();},{passive:false});canvas.addEventListener('mousedown',jump);
function spawnPowerUp(){var types=['heart','shield','magnet']; var t=types[Math.floor(Math.random()*3)]; powerUps.push({x:400,y:Math.random()*300+100,w:32,h:32,type:t,life:420,scale:1,dir:1});}
function loop(){if(!run) return; fr++; ctx.clearRect(0,0,400,720); var cfg=DIFFS[diff];if(fr%cfg.bread===0){it.push({x:400,y:Math.random()*400+80,w:30,h:30,done:false});}if(fr%cfg.hole===0){ob.push({x:400,y:590,w:34,h:30});}nextPowerUp--; if(nextPowerUp<=0){spawnPowerUp(); nextPowerUp=Math.floor(Math.random()*(3600-1800)+1800);}if(superMagTimer>0) superMagTimer--;var s=getCurSkinObj();if(s.ghost){ghostTimer++; if(ghostTimer>500){ghostActive=150; ghostTimer=0;} if(ghostActive>0) ghostActive--;}for(var i=0;i<it.length;i++){var item=it[i]; if(!item.done){item.x-=sp; var mag=s.magnet; if(superMagTimer>0) mag=350; if(mag>0){var dx=p.x-item.x,dy=p.y-item.y; var dist=Math.sqrt(dx*dx+dy*dy); if(dist<mag){item.x+=(p.x-item.x)*0.12; item.y+=(p.y-item.y)*0.12;}} ctx.font='30px serif'; ctx.fillText('🫓',item.x,item.y); if(item.x<p.x+p.w && item.x+item.w>p.x && item.y<p.y+p.h+10 && item.y+item.h>p.y){item.done=true; var add=s.x2?2:1; sc+=add; coins+=add; localStorage.setItem('rCoins',coins); document.getElementById('score').innerText=sc; document.getElementById('coins').innerText=coins; if(sc%10===0) sp+=0.25;}}}it=it.filter(function(x){return!x.done && x.x>-50;});for(var pi=0;pi<powerUps.length;pi++){var pu=powerUps[pi]; pu.x-=sp; pu.life--; pu.scale+=0.02*pu.dir; if(pu.scale>1.2||pu.scale<0.8) pu.dir*=-1; ctx.save(); ctx.translate(pu.x+16,pu.y+16); ctx.scale(pu.scale,pu.scale); ctx.font='32px serif'; var icon=pu.type==='heart'?'❤️':pu.type==='shield'?'🛡️':'🧲'; ctx.fillText(icon,-16,8); ctx.restore(); if(pu.x<p.x+p.w && pu.x+pu.w>p.x && pu.y<p.y+p.h && pu.y+pu.h>p.y){ if(pu.type==='heart'){extraLife=1;} else if(pu.type==='shield'){shield++;} else if(pu.type==='magnet'){superMagTimer=600;} powerUps.splice(pi,1); pi--; continue;} }powerUps=powerUps.filter(function(x){return x.x>-50 && x.life>0;});for(var j=0;j<ob.length;j++){var o=ob[j]; o.x-=sp; ctx.font='34px serif'; ctx.fillText('🕳️',o.x,o.y+25); if(o.x<p.x+p.w-10 && o.x+o.w>p.x+10 && o.y<p.y+p.h && o.y+o.h>p.y){ if(p.dashing || ghostActive>0){ ob.splice(j,1); j--; continue; } if(extraLife>0){extraLife=0; ob.splice(j,1); j--; continue;} if(shield>0){shield--; ob.splice(j,1); j--; } else {return over();}} }ob=ob.filter(function(x){return x.x>-50;});p.upd(); p.draw();if(shield>0){ctx.font='16px serif'; ctx.fillText('🛡️x'+shield,p.x+30,p.y-5);}if(extraLife>0){ctx.font='16px serif'; ctx.fillText('❤️',p.x+30,p.y-22);}if(superMagTimer>0){ctx.font='12px serif'; ctx.fillStyle='#00ffff'; ctx.fillText('🧲 '+(superMagTimer/60|0)+'s',p.x,p.y-38);}if(s.ghost && ghostActive>0){ctx.fillStyle='#fff'; ctx.font='12px serif'; ctx.fillText('👻 مخفي',p.x,p.y-12);}if(s.dash){ctx.fillStyle='#00ffff'; ctx.font='11px serif'; ctx.fillText('💨 داش: اضغط مرتين بسرعة',10,20);}ctx.fillStyle='#ff8906'; ctx.fillRect(0,620,400,8);requestAnimationFrame(loop);}
function over(){run=false; if(sc>best){best=sc; localStorage.setItem('rB',best);} tempScore=sc; var players=getPlayers(); players.sort(function(a,b){return b.score-a.score;}); var low=players.length<10?0:(players[9]?.score||0); if(sc>0 && (players.length<10 || sc>low)){document.getElementById('finalScore').innerText=sc; document.getElementById('nameOv').style.display='flex';} else {showOver();}}
function savePlayerName(){var n=document.getElementById('playerNameInput').value.trim(); if(n.length<2){alert('اكتب اسم أطول');return;} var pl=getPlayers(); pl.push({name:n,score:tempScore,id:Date.now()}); localStorage.setItem('rPlayers',JSON.stringify(pl)); localStorage.setItem('rWeeklyBest',JSON.stringify({name:n,score:tempScore})); document.getElementById('nameOv').style.display='none'; showOver(); updateBannerOld(); renderTop10();}
function skipName(){document.getElementById('nameOv').style.display='none'; showOver();}
function showOver(){var ov=document.getElementById('ov'); ov.style.display='flex'; ov.innerHTML='<h1 style="color:#ffbe0b">جبت '+tempScore+' خبزة!</h1><div class="leaderboard"><p style="color:#ffbe0b;font-weight:900">🏆 أفضل 10</p><div id="top10ListOver"></div></div><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;width:100%;max-width:320px"><button onclick="location.reload()" style="flex:1">مرة تانية 🔄</button><button onclick="openShop()" style="background:#00ff88">متجر 🛒</button><button onclick="location.reload()" style="background:#333;color:#fff">رجوع</button></div>'; renderTop10(true);}
function openShop(){document.getElementById('shop').style.display='flex'; document.getElementById('ov').style.display='none'; document.getElementById('diffOv').style.display='none'; renderSkins(); var u=localStorage.getItem('rAnnounceUrl')||''; document.getElementById('currentAnnounceUrl').innerText=u; var c=localStorage.getItem('rCachedAnnounce')||''; if(c) document.getElementById('announceText').value=c;}
function closeShop(){document.getElementById('shop').style.display='none'; document.getElementById('ov').style.display='flex'; renderTop10();}
function renderSkins(){document.getElementById('shopCoins').innerText=coins; var l=document.getElementById('skinsList'); l.innerHTML=''; for(var i=0;i<SKINS.length;i++){var s=SKINS[i]; var o=owned.indexOf(s.id)>=0; var c=curSkin===s.id; var div=document.createElement('div'); div.className='skin '+(o?'owned ':'')+(c?'selected':''); var btn=c?'✅':o?'<button onclick="selectSkin(\''+s.id+'\')">استخدم</button>':'<button onclick="buySkin(\''+s.id+'\','+s.price+')">'+s.price+' 🪙</button>'; div.innerHTML='<div style="text-align:right"><div>'+s.id+' '+s.name+' - '+s.price+'</div><div style="font-size:10px;color:#888">'+s.desc+'</div></div><div>'+btn+'</div>'; l.appendChild(div);}}
function buySkin(id,pr){if(coins>=pr){coins-=pr; owned.push(id); localStorage.setItem('rCoins',coins); localStorage.setItem('rOwned',JSON.stringify(owned)); selectSkin(id);} else {alert('ما عندك عملات كافية - تحتاج '+pr);}}
function selectSkin(id){curSkin=id; localStorage.setItem('rSkin',id); renderSkins();}
function getGiftPool(){try{return JSON.parse(localStorage.getItem('rGiftPool')||'{}');}catch(e){return {};}}
function redeem(){var el=document.getElementById('codeInp');var code=el.value.trim().toUpperCase();var msg=document.getElementById('redeemMsg');if(!code) return;if(code==='ADMIN123'){document.getElementById('adminBox').style.display='block'; msg.innerText='✅ فتح الادمن'; el.value=''; var u=localStorage.getItem('rAnnounceUrl')||''; document.getElementById('currentAnnounceUrl').innerText=u; return;}if(localStorage.getItem('used_'+code)==='1'){msg.innerText='⚠️ مستخدم من قبل'; return;}if(code.startsWith('RBOOSH')){var m=code.match(/^RBOOSH(\d+)-([A-Z0-9]{3,8})$/);if(m){var val=parseInt(m[1]);if(val>0 && val<=1000000){coins+=val;localStorage.setItem('rCoins',coins);localStorage.setItem('used_'+code,'1');var pool=getGiftPool(); pool[code]={value:val,used:true}; localStorage.setItem('rGiftPool',JSON.stringify(pool));msg.innerText='🎁 +'+val+' تم!';document.getElementById('shopCoins').innerText=coins;document.getElementById('coins').innerText=coins;document.getElementById('ovCoins').innerText=coins;el.value=''; return;}}}var pool2=getGiftPool();if(pool2[code] &&!pool2[code].used){coins+=pool2[code].value; localStorage.setItem('rCoins',coins); pool2[code].used=true; localStorage.setItem('rGiftPool',JSON.stringify(pool2)); localStorage.setItem('used_'+code,'1'); msg.innerText='🎁 +'+pool2[code].value; document.getElementById('shopCoins').innerText=coins; document.getElementById('coins').innerText=coins; document.getElementById('ovCoins').innerText=coins; el.value=''; return;}msg.innerText='❌ كود غلط';}
function generateCodes(){var val=parseInt(document.getElementById('giftValue').value); var pool=getGiftPool(); var out=[]; for(var i=0;i<5;i++){var r=Math.random().toString(36).substring(2,7).toUpperCase(); var c='RBOOSH'+val+'-'+r; pool[c]={value:val,used:false}; out.push(c);} localStorage.setItem('rGiftPool',JSON.stringify(pool)); document.getElementById('generatedCodes').innerHTML=out.map(function(c){return '<div style="background:#000;color:#0f0;padding:4px;margin:2px;font-family:monospace;font-size:11px;direction:ltr">'+c+'</div>';}).join('');}
function getPlayers(){try{return JSON.parse(localStorage.getItem('rPlayers')||'[]');}catch(e){return [];}}
function renderTop10(isOver){var pl=getPlayers(); var el=document.getElementById(isOver?'top10ListOver':'top10List'); if(!el) return; if(!pl.length){el.innerHTML='<p style="color:#555;font-size:11px">كن أول بطل! 🏆</p>';return;} pl.sort(function(a,b){return b.score-a.score;}); var top=pl.slice(0,10); el.innerHTML=top.map(function(p,i){var m=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.'; return '<div class="leaderRow '+(i===0?'top1':'')+'"><span>'+m+' '+p.name+'</span><span>'+p.score+'</span></div>';}).join('');}
function updateBannerOld(){var b=document.getElementById('topPlayerBanner'); try{var bestW=JSON.parse(localStorage.getItem('rWeeklyBest')||'null'); if(bestW){b.style.display='block'; b.innerHTML='🏆 أفضل لاعب: '+bestW.name+' - '+bestW.score+' 🔥';} else b.style.display='none';}catch(e){}}
/* === نظام الاعلانات العام الجديد - لا يمس اللعبة === */
async function fetchAnnouncement(){
  var url=localStorage.getItem('rAnnounceUrl');
  if(!url){ updateBannerOld(); return; }
  try{
    var res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw 0;
    var data=await res.json();
    if(data && data.text && data.text.trim()!==''){
      var b=document.getElementById('topPlayerBanner');
      b.style.display='block';
      b.innerHTML=data.text;
      localStorage.setItem('rCachedAnnounce',data.text);
      return;
    } else {
      // اعلان فاضي = احذف وارجع للقديم
      var b2=document.getElementById('topPlayerBanner');
      b2.style.display='none';
      localStorage.removeItem('rCachedAnnounce');
      updateBannerOld();
    }
  }catch(e){
    var cached=localStorage.getItem('rCachedAnnounce');
    if(cached){ var b=document.getElementById('topPlayerBanner'); b.style.display='block'; b.innerHTML=cached; return; }
    updateBannerOld();
  }
}
async function createAnnounceBin(){
  var st=document.getElementById('announceStatus');
  st.innerText='⏳ عم ننشئ رابط جديد...';
  try{
    var res=await fetch('https://api.npoint.io',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'🏆 مرحبا بكم في RBooSH - تابعوني @abo.jano'})});
    var data=await res.json();
    var id=data.id;
    var url='https://api.npoint.io/'+id;
    localStorage.setItem('rAnnounceUrl',url);
    document.getElementById('currentAnnounceUrl').innerText=url;
    st.innerText='✅ تم انشاء الرابط! هلا اكتب اعلانك وانشر';
    localStorage.setItem('rCachedAnnounce','🏆 مرحبا بكم في RBooSH - تابعوني @abo.jano');
    fetchAnnouncement();
  }catch(e){ st.innerText='❌ فشل الانشاء، تأكد من النت وحاول تاني'; }
}
async function publishAnnouncement(){
  var url=localStorage.getItem('rAnnounceUrl');
  var txt=document.getElementById('announceText').value.trim();
  var st=document.getElementById('announceStatus');
  if(!url){ st.innerText='⚠️ اول شي اكبس انشاء رابط'; return; }
  if(!txt){ st.innerText='⚠️ اكتب اعلان'; return; }
  st.innerText='⏳ جاري النشر لكل اللاعبين...';
  try{
    await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:txt,time:Date.now()})});
    localStorage.setItem('rCachedAnnounce',txt);
    st.innerText='✅ تم النشر! كل اللاعبين رح يشوفوه';
    fetchAnnouncement();
  }catch(e){ st.innerText='❌ فشل النشر، جرب تاني'; }
}
async function clearAnnouncement(){
  var url=localStorage.getItem('rAnnounceUrl');
  var st=document.getElementById('announceStatus');
  if(!url){ updateBannerOld(); document.getElementById('topPlayerBanner').style.display='none'; localStorage.removeItem('rCachedAnnounce'); st.innerText='✅ تم الحذف'; return; }
  st.innerText='⏳ جاري الحذف...';
  try{
    await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:''})});
    localStorage.removeItem('rCachedAnnounce');
    document.getElementById('announceText').value='';
    document.getElementById('topPlayerBanner').style.display='none';
    st.innerText='✅ تم حذف الاعلان وارجعنا لأفضل لاعب';
    updateBannerOld();
  }catch(e){ localStorage.removeItem('rCachedAnnounce'); document.getElementById('topPlayerBanner').style.display='none'; st.innerText='✅ تم الحذف محليا'; updateBannerOld(); }
}

<div style="position:fixed;bottom:12px;left:12px;z-index:9999;display:flex;gap:6px">
  <button id="soundToggle" onclick="toggleSounds()" style="background:#1a1a2e;color:#fff;border:2px solid #ffbe0b;border-radius:50%;width:46px;height:46px;font-size:20px">🔊</button>
</div>
<script>
let soundEnabled = localStorage.getItem('rSound')!== 'off';
let audioCtx = null;
function getCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function tone(f,d,t='sine',v=0.3){ if(!soundEnabled) return; try{ let c=getCtx(),o=c.createOscillator(),g=c.createGain(); o.type=t; o.frequency.value=f; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(v,c.currentTime); g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+d); o.start(); o.stop(c.currentTime+d);}catch(e){} }
function getSkinTier(){ try{ let s=typeof getCurSkinObj==='function'?getCurSkinObj():{price:0}; if(s.price>=100000) return 'legend'; if(s.price>=40000) return 'epic'; if(s.price>=5000) return 'rare'; if(s.price>=500) return 'common'; return 'basic'; }catch(e){return 'basic';}}
function sJump(){ let tier=getSkinTier(); if(tier==='legend'){ tone(500,0.12,'sine',0.4); setTimeout(()=>tone(900,0.15,'sine',0.3),60); } else if(tier==='epic'){ tone(400,0.15,'triangle',0.4); } else if(tier==='rare'){ tone(350,0.12,'sine',0.35); } else { tone(300,0.1,'sine',0.3); }}
function sCollect(){ let tier=getSkinTier(); if(tier==='legend'){ tone(1000,0.1,'sine',0.4); setTimeout(()=>tone(1500,0.15,'sine',0.3),50); setTimeout(()=>tone(2000,0.1,'sine',0.2),100); } else if(tier==='epic'){ tone(800,0.12,'sine',0.4); setTimeout(()=>tone(1200,0.12,'sine',0.3),60); } else { tone(700,0.1,'sine',0.35); }}
function toggleSounds(){ soundEnabled=!soundEnabled; localStorage.setItem('rSound',soundEnabled?'on':'off'); document.getElementById('soundToggle').innerText=soundEnabled?'🔊':'🔇'; if(soundEnabled) sCollect(); }
document.getElementById('soundToggle').innerText=soundEnabled?'🔊':'🔇';
</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RBooSH - دبل نطة!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0f0e17;color:#fff;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#h{width:100%;max-width:500px;display:flex;justify-content:space-between;padding:12px 20px;font-size:20px;font-weight:900}
#score{color:#ff8906} #best{color:#e53170}
canvas{background:linear-gradient(#1a1a2e 0%, #16213e 50%, #0f3460 100%);border-radius:22px;border:4px solid #ff8906;max-width:95vw;max-height:68vh;touch-action:none}
button{background:#ff8906;color:#000;border:none;padding:14px 30px;border-radius:50px;font-weight:900;font-size:19px;cursor:pointer;user-select:none}
#ov{position:absolute;inset:0;background:rgba(0,0,0,0.88);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:22px;text-align:center;padding:20px}
.jump-effect{position:absolute;color:#ffbe0b;font-weight:900;font-size:18px;animation:pop 0.5s forwards}
@keyframes pop{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-30px) scale(1.5);opacity:0}}
</style>
</head>
<body>
<div id="h"><div>النقاط: <span id="score">0</span></div><div>أعلى: <span id="best">0</span></div></div>
<div style="position:relative" id="gameBox">
<canvas id="c" width="400" height="600"></canvas>
<div id="ov">
<div style="font-size:50px">🏃‍♂️🫓</div>
<h1 style="font-size:52px;color:#ff8906">RBooSH</h1>
<p style="font-size:18px;margin:12px 0">خبز واطي = نطة وحدة<br>خبز عالي = <b style="color:#ffbe0b">دبل نطة!!</b> ⬆️⬆️</p>
<button onclick="start()">يلا دحّق!</button>
</div>
</div>
<button onclick="jump()" style="margin-top:12px">نطّة ⬆️</button>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),gameBox=document.getElementById('gameBox');
let p,it,ob,sc,best=localStorage.getItem('rB')||0,run=false,sp=3.2,fr=0;
document.getElementById('best').textContent=best;
class Pl{
 constructor(){this.x=60;this.y=450;this.w=38;this.h=50;this.vy=0;this.jumps=0;this.maxJumps=2}
 upd(){
  this.vy+=0.9; // جاذبية
  this.y+=this.vy;
  if(this.y>=450){this.y=450;this.vy=0;this.jumps=0} // لما ينزل للأرض تصفر النطات
 }
 draw(){
  // ظل
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(this.x+19, 506, 18, 5, 0,0,Math.PI*2);ctx.fill();
  ctx.font='38px serif';ctx.fillText('🧒',this.x-4,this.y+38);
  if(this.jumps>0){ctx.font='12px serif';ctx.fillStyle='#ffbe0b';ctx.fillText(this.jumps==1?'·':'··',this.x+12,this.y-5)}
 }
 jump(){
  if(this.jumps < this.maxJumps){
   this.vy = -16.5; // نطة قوية
   this.jumps++;
   // تأثير بصري
   const eff=document.createElement('div');eff.className='jump-effect';eff.style.left=(this.x+10)+'px';eff.style.top=(this.y+10)+'px';
   eff.textContent=this.jumps==2?'دبل! 🚀':'نطة!';gameBox.appendChild(eff);setTimeout(()=>eff.remove(),500);
   if(this.jumps==2){ // تأثير دبل نطة
     ctx.fillStyle='#ffbe0b'; // وميض
   }
  }
 }
}
function start(){p=new Pl();it=[];ob=[];sc=0;sp=3.2;fr=0;run=true;document.getElementById('ov').style.display='none';document.getElementById('score').textContent=0;loop()}
function jump(){if(run)p.jump()}
canvas.addEventListener('touchstart',e=>{e.preventDefault();jump()});canvas.addEventListener('mousedown',jump);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump()}});
function loop(){
 if(!run)return;fr++;ctx.clearRect(0,0,400,600);
 // خبز - مرات واطي مرات عالي مشان تحتاج دبل نطة
 if(fr%70==0){
   const high = Math.random()>0.5; // 50% خبز عالي
   it.push({x:400,y: high ? Math.random()*150+80 : Math.random()*150+280, w:30,h:30,done:false, high:high})
 }
 if(fr%90==0)ob.push({x:400,y:470,w:34,h:30});
 for(let i of it){
  i.x-=sp;ctx.font= i.high ? '32px serif' : '28px serif';ctx.fillText('🫓',i.x,i.y);
  if(i.high){ctx.fillStyle='rgba(255,190,11,0.3)';ctx.fillRect(i.x-2,i.y-2,36,6)} // خط للدلالة انو عالي
  if(!i.done&&i.x<p.x+p.w&&i.x+i.w>p.x&&i.y<p.y+p.h+10&&i.y+i.h>p.y){
   i.done=true;sc+= i.high ? 2 : 1; // الخبز العالي نقطتين!
   document.getElementById('score').textContent=sc;
   if(sc%10==0)sp+=0.5;
  }
 } it=it.filter(x=>!x.done&&x.x>-50);
 for(let o of ob){o.x-=sp;ctx.font='30px serif';ctx.fillText('🕳️',o.x,o.y+25);if(o.x<p.x+p.w-8&&o.x+o.w>p.x+8&&o.y<p.y+p.h&&o.y+o.h>p.y){return over()}} ob=ob.filter(x=>x.x>-50);
 p.upd();p.draw();ctx.fillStyle='#ff8906';ctx.fillRect(0,500,400,6);requestAnimationFrame(loop)
}
function over(){run=false;if(sc>best){best=sc;localStorage.setItem('rB',best);document.getElementById('best').textContent=best}const ov=document.getElementById('ov');ov.style.display='flex';ov.innerHTML=`<div style="font-size:50px">${sc>12?'🔥':'💀'}</div><h1 style="font-size:42px;color:#ff8906">${sc>12?'أسطورة الحسكة!':'أووبس!'}</h1><p style="font-size:22px">جمعت ${sc} خبزة</p><p>أعلى رقم: ${best}</p><button onclick="start()" style="margin-top:15px">دبل نطة مرة تانية 🚀</button>`}
</script>
</body>
</html>
